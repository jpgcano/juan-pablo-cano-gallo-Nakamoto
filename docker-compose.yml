services:
  db:
    build:
      context: ./database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bd_juan_cano_nakamoto}
      POSTGRES_USER: ${POSTGRES_USER:-riwi_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '${HOST_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/health > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  migrate:
    build:
      context: ./database
      target: migrator
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-riwi_owner}:${POSTGRES_PASSWORD:-devpass}@db:5432/${POSTGRES_DB:-bd_juan_cano_nakamoto}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c 'pnpm migrate && pnpm seed'
    restart: 'no'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-5173}:80'

volumes:
  postgres_data:
